<article class="card" [class.favorita]="esFavorita">
  <span class="categoria">{{ noticia.categoria }}</span>

  <h3 class="titulo">{{ noticia.titulo }}</h3>

  <p class="resumen">{{ noticia.resumen }}</p>

  <footer class="meta">
    <span class="autor">{{ noticia.autor }}</span>
    <span class="fecha">{{ noticia.fecha }}</span>
  </footer>

  <button
    type="button"
    class="btn-favorito"
    [class.activo]="esFavorita"
    (click)="onToggleFavorito()">
    {{ esFavorita ? '♥ En favoritos' : '♡ Agregar a favoritos' }}
  </button>
</article>
